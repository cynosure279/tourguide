[package]
name = "tour-guide"
version = "1.0.0"
description = "景区旅游信息管理系统桌面版"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "tour_guide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
