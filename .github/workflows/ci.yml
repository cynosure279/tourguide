name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: 构建（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 配置并编译后端
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: 冒烟测试（启动 + 健康检查 + 页面）
        run: |
          BIN=$(find build -name 'tour-backend*' -type f ! -name '*.pdb' | head -1)
          "$BIN" &
          sleep 3
          curl -sf http://localhost:8080/api/health
          curl -sf http://localhost:8080/api/attractions > /dev/null
          curl -sf http://localhost:8080/ > /dev/null
          kill %1

      - uses: actions/upload-artifact@v4
        with:
          name: tour-backend-${{ matrix.os }}
          path: build/bin/
          if-no-files-found: ignore
