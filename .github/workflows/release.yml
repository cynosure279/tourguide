name: Release

# 在 release 分支上打 v* 标签并推送，即触发多平台打包与 GitHub Release 发布
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: 打包（${{ matrix.name }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 配置并编译（内嵌前端，生成自包含单文件）
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEMBED_FRONTEND=ON
          cmake --build build --config Release

      - name: 冒烟测试
        run: |
          BIN=$(find build -name 'tour-backend*' -type f ! -name '*.pdb' | head -1)
          "$BIN" &
          sleep 3
          curl -sf http://localhost:8080/api/health
          curl -sf http://localhost:8080/ > /dev/null
          kill %1

      - name: 收集产物
        run: |
          mkdir -p dist-pkg
          BIN=$(find build -name 'tour-backend*' -type f ! -name '*.pdb' | head -1)
          cp "$BIN" dist-pkg/
          cp README.md dist-pkg/ 2>/dev/null || true

      - name: 打压缩包（Windows 用 zip，其余用 tar.gz）
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -Command "Compress-Archive -Path dist-pkg/* -DestinationPath tour-backend-${{ matrix.name }}.zip"
          else
            tar -czf "tour-backend-${{ matrix.name }}.tar.gz" -C dist-pkg .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tour-backend-${{ matrix.name }}
          path: tour-backend-*

  desktop:
    name: 桌面应用（${{ matrix.name }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci
      - name: 安装 Linux 桌面依赖（仅 ubuntu）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
      - name: 上传桌面安装包
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: frontend/src-tauri/target/release/bundle/

  publish:
    name: 发布 GitHub Release
    needs: [package, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
